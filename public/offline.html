<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>لا يوجد اتصال — منصة إسماعيل أحمد نجيب</title>
    <style>
      :root {
        --primary: #0e7490;
        --primary-dark: #155e75;
        --gold: #b45309;
        --cream: #fdfaf4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--cream);
        color: #1f2937;
        font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
        line-height: 1.8;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(14, 116, 144, 0.1);
      }
      .icon { font-size: 52px; line-height: 1; }
      h1 {
        margin: 16px 0 8px;
        font-size: 22px;
        color: var(--primary-dark);
      }
      p { margin: 0 0 20px; color: #4b5563; font-size: 15px; }
      ul {
        margin: 0 0 24px;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 8px;
        text-align: right;
      }
      li a {
        display: block;
        padding: 10px 14px;
        border-radius: 12px;
        background: #f0f9ff;
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
      li a:hover { background: #e0f2fe; }
      .retry {
        display: inline-block;
        width: 100%;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      .retry:hover { background: var(--primary-dark); }
      .hint { margin: 16px 0 0; font-size: 12px; color: #9ca3af; }
      [dir="ltr"] ul { text-align: left; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p id="msg">
        تعذّر الوصول إلى الشبكة. يمكنك الوصول إلى الصفحات المحفوظة على جهازك:
      </p>

      <ul>
        <li><a href="/ar/adhkar">📿 الأذكار</a></li>
        <li><a href="/ar/quran">📖 القرآن الكريم</a></li>
        <li><a href="/ar/qibla">🧭 اتجاه القبلة</a></li>
        <li><a href="/ar/prayer-times">🕌 مواقيت الصلاة</a></li>
        <li><a href="/ar/tasbih">🔢 المسبحة</a></li>
        <li><a href="/ar">🏠 الصفحة الرئيسية</a></li>
      </ul>

      <button class="retry" type="button" onclick="location.reload()">
        إعادة المحاولة
      </button>

      <p class="hint">
        No connection.
        <a href="/en/adhkar">Adhkar</a> ·
        <a href="/en/quran">Quran</a> ·
        <a href="/en/prayer-times">Prayer times</a>
      </p>
    </main>
  </body>
</html>
