name: handoff-consistency

on:
  push:
    branches: [main]
  pull_request:

jobs:
  handoff:
    name: Owner handoff consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate handoff and launch checklist
        run: npm run qa:handoff
